
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Settings</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo&family=Open+Sans&family=Roboto&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Page Settings</h1>

        <div class="settings">

            <!-- Font Family -->
            <div class="setting">
                <label for="font">Choose Font</label>

                <select id="font">
                    <option value="Open Sans">Open Sans</option>
                    <option value="Cairo">Cairo</option>
                    <option value="Roboto">Roboto</option>
                </select>
            </div>

            <!-- Font Color -->
            <div class="setting">
                <label for="color">Choose Color</label>

                <select id="color">
                    <option value="black">Black</option>
                    <option value="red">Red</option>
                    <option value="blue">Blue</option>
                    <option value="green">Green</option>
                    <option value="purple">Purple</option>
                    <option value="orange">Orange</option>
                </select>
            </div>

            <!-- Font Size -->
            <div class="setting">
                <label for="size">Choose Font Size</label>

                <select id="size">
                    <option value="16px">16px</option>
                    <option value="18px">18px</option>
                    <option value="20px">20px</option>
                    <option value="22px">22px</option>
                    <option value="26px">26px</option>
                    <option value="30px">30px</option>
                </select>
            </div>

        </div>

        <div class="content">
            <h2>Welcome to My Page</h2>

            <p>
                This is a simple page to test changing
                font family, font color and font size.
            </p>

            <p>
                You can customize the appearance of this page
                using the settings above.
            </p>
        </div>

    </div>
    //2


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Registration Form</h1>

        <form>

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="input-group">
                <label for="department">Choose Department</label>

                <select id="department">
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Information Systems">Information Systems</option>
                </select>
            </div>

            <button type="submit">Submit</button>

        </form>

    </div>
    <script src="main.js"></script>
</body>
</html>
